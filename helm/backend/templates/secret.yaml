apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miniatures-contest-backend.fullname" . }}-secret
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.JWT_SECRET is required" .Values.secrets.JWT_SECRET | quote }}
  PG_PASSWORD: {{ required "secrets.PG_PASSWORD is required" .Values.secrets.PG_PASSWORD | quote }}
  MINIO_ACCESS_KEY: {{ required "secrets.MINIO_ACCESS_KEY is required" .Values.secrets.MINIO_ACCESS_KEY | quote }}
  MINIO_SECRET_KEY: {{ required "secrets.MINIO_SECRET_KEY is required" .Values.secrets.MINIO_SECRET_KEY | quote }}
