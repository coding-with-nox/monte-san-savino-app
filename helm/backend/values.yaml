replicaCount: 2
image:
  repository: ghcr.io/your-org/miniatures-contest-backend
  tag: "latest"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
env:
  PORT: "3000"
  PG_HOST: "postgres"
  PG_PORT: "5432"
  PG_DB: "tenant_db_1"
  PG_USER: "postgres"
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_BUCKET: "models"
  MINIO_PUBLIC_URL: "http://minio:9000"
secrets:
  # REQUIRED, no default: helm template/install fails if empty (set via --set or a private values file)
  JWT_SECRET: ""
  # All REQUIRED, no default (`required` in templates/secret.yaml): set via --set or a private values file.
  PG_PASSWORD: ""
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
ingress:
  enabled: false
  className: ""
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
