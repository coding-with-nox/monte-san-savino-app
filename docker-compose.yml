services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TENANT_DB_NAME: ${TENANT_DB_NAME:-tenant_db_1}
    # Not published on the host: reachable only from the compose network.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    # S3 API bound to loopback only: model image URLs (MINIO_PUBLIC_URL, default
    # http://localhost:9000) are fetched directly by the browser on this machine.
    # The console (9001) is not published; use docker-compose.debug.yml for it.
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data

  backend:
    image: ghcr.io/coding-with-nox/monte-san-savino-app-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      db-schema:
        condition: service_completed_successfully
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: ${TENANT_DB_NAME:-tenant_db_1}
      PG_USER: ${POSTGRES_USER:-postgres}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    # Not published: the browser reaches the API through nginx at /api (port 8080).
    expose:
      - "3000"

  frontend:
    image: ghcr.io/coding-with-nox/monte-san-savino-app-frontend:latest
    depends_on:
      backend:
        condition: service_started
      # db-seed only exists with `--profile demo`; do not block start-up without it.
      db-seed:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    ports:
      - "8080:8080"

  # One-shot psql client: loads schema into the postgres service database.
  db-schema:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TENANT_DB_NAME: ${TENANT_DB_NAME:-tenant_db_1}
      PGHOST: postgres
      PGPORT: 5432
    volumes:
      - ./docker/postgres/01-init-tenant.sh:/scripts/01-init-tenant.sh:ro
    command: >
      bash -c "until pg_isready -h postgres -p 5432 -U $${POSTGRES_USER}; do sleep 1; done;
      bash /scripts/01-init-tenant.sh"
    restart: "no"

  # DEMO ONLY (opt-in): `docker compose --profile demo up`.
  # Loads fictitious demo data, and only into an EMPTY database (users = 0).
  # Requires DEMO_PASSWORD_HASH (argon2id hash, no default): see docs/configuration_deploy_debug.md, "Profilo demo".
  # Never enable on a real/production database.
  db-seed:
    profiles: ["demo"]
    image: postgres:16
    depends_on:
      backend:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TENANT_DB_NAME: ${TENANT_DB_NAME:-tenant_db_1}
      # Mandatory for the demo profile; checked by 02-test-data.sh (not here, so that
      # `compose config/up` without the demo profile does not require it).
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:-}
      PGHOST: postgres
      PGPORT: 5432
    volumes:
      - ./docker/postgres/02-test-data.sh:/scripts/02-test-data.sh:ro
    command: >
      bash -c "
        until pg_isready -h postgres -p 5432 -U $${POSTGRES_USER}; do sleep 1; done;
        export PGPASSWORD=$${POSTGRES_PASSWORD};
        until psql -h postgres -U $${POSTGRES_USER} -d $${TENANT_DB_NAME} -tAc \"SELECT to_regclass('public.team_mates') IS NOT NULL AND to_regclass('public.award_brackets') IS NOT NULL AND to_regclass('public.judge_completions') IS NOT NULL;\" | grep -q t; do sleep 1; done;
        bash /scripts/02-test-data.sh
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:
