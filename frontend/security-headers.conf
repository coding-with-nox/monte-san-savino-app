# Shared security headers. Included from the server block AND from every location that
# declares its own add_header (nginx: add_header in a nested block REPLACES the ones of the
# parent, so each such location must `include` this file again).
#
# Installed at /etc/nginx/snippets/security-headers.conf (docker-compose mounts this file;
# frontend/Dockerfile bakes in a copy: frontend/security-headers.conf, keep the two identical,
# CI checks it).
#
# OPERATOR: replace http://localhost:9000 (appears in img-src and connect-src) with the origin of
# MINIO_PUBLIC_URL (scheme://host[:port], no path), e.g. https://files.example.org.
# Same host must be used by backend MINIO_PUBLIC_URL, otherwise model images and signed uploads
# are blocked by the browser.
#
# Third parties allowed (all required by the current frontend):
#   fonts.googleapis.com / fonts.gstatic.com  Roboto + Material Symbols loaded from index.html
#                                              (self-hosting them would let you drop both, needs frontend change)
#   *.tile.openstreetmap.org                   Leaflet tiles
#   photon.komoot.io                           geocoding (fetch)
#   labelwriter.com + 127.0.0.1/localhost:41951 DYMO label SDK and its local web service (optional feature;
#                                              remove if DYMO printing is not used)
# 'unsafe-inline' in style-src is required by MUI/emotion. blob: in img-src for previews, data: for QR/icons.
# Exports opened with window.open(blob:) inherit this policy (they contain no inline scripts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://labelwriter.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org http://localhost:9000; connect-src 'self' http://localhost:9000 https://photon.komoot.io https://127.0.0.1:41951 https://localhost:41951; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# HSTS: enable ONLY when the site is served over HTTPS (it breaks plain-http deployments and is
# cached by browsers). Uncomment after TLS is in place:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
