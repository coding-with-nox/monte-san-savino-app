# First layer against password guessing and floods (SEC-04): per client IP on the auth endpoints.
# The backend adds finer limits (per IP and per IP + account).
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_status 429;

server {
  # Unprivileged port (nginx-unprivileged image runs as non-root and cannot bind :80).
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # Behind a TLS proxy on the Docker network (Caddy) the client IP comes in X-Forwarded-For.
  # Trusted only from the Docker networks, so a client cannot forge it.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  location / {
    try_files $uri /index.html;
  }

  location ^~ /api/auth/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://backend:3000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /auth {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
