# HTTPS for a server reachable from the internet (SEC-01).
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Needs in .env: APP_DOMAIN (e.g. app.example.org), FILES_DOMAIN (e.g. files.example.org),
# ACME_EMAIL (Let's Encrypt account). DNS of both names -> this server; firewall: 80 and 443 only.
# Docker Compose >= 2.24 (for !reset). See docs/stage-deploy-single-vm.md, section 9.
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - minio
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      FILES_DOMAIN: ${FILES_DOMAIN:?FILES_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Only Caddy is published: nginx and MinIO are reached through it.
  frontend:
    ports: !reset []
    expose:
      - "8080"

  minio:
    ports: !reset []
    expose:
      - "9000"

  # Public URLs in https: judge sheets / QR codes and model images.
  backend:
    environment:
      PUBLIC_APP_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      MINIO_PUBLIC_URL: https://${FILES_DOMAIN:?FILES_DOMAIN is required}

  # Model images are public by design (publicUrl): anonymous read-only download on the bucket.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      sh -c "
        until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/dev/null 2>&1; do sleep 1; done;
        mc mb -p local/$${MINIO_BUCKET} &&
        mc anonymous set download local/$${MINIO_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-models}
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
