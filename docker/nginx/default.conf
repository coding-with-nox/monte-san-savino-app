# First layer against password guessing and floods (SEC-04): per client IP on the auth endpoints.
# The backend adds finer limits (per IP and per IP + account).
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_status 429;

server {
  # Unprivileged port (nginx-unprivileged image runs as non-root and cannot bind :80).
  listen 8080;
  server_name _;

  include /etc/nginx/snippets/security-headers.conf;

  # Behind Caddy (docker-compose.tls.yml) the client IP comes in X-Forwarded-For, which Caddy
  # overwrites. Trusted only from the Docker networks: from anywhere else $remote_addr stays the
  # socket address, so a client cannot forge it. Rate limits then apply to the real client.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  # Auth API (login, register, password reset): same proxy, rate limited per IP.
  location ^~ /api/auth/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://backend:3000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Tenant $http_x_tenant;
  }

  # API -> backend container
  location /api/ {
    proxy_pass http://backend:3000/;   # /api/health -> backend /health
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: a client-sent X-Forwarded-For must not reach the backend (SEC-17).
    proxy_set_header X-Forwarded-For $remote_addr;

    # Se ti serve passare tenant header:
    proxy_set_header X-Tenant $http_x_tenant;
  }

  # SPA
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
